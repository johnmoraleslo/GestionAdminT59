<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1f3a">
<title>Torre 59 · Portal de copropietarios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#e9eff7; --surface:#ffffff; --surface-2:#f3f7fb; --ink:#0d2238; --muted:#566b82; --line:#d8e2ee;
  --navy:#0b1f3a; --mint:#e8913f; --amber:#ffb547;
  --ok-bg:#d9f5ec; --ok:#0b7a5c; --bad-bg:#fde4e4; --bad:#c2262b; --warn-bg:#fff0d4; --warn:#8a5a00;
  --hero:linear-gradient(135deg,#0a1c2e 0%,#0d3345 55%,#2f6d68 100%);
  --shadow:0 18px 40px -22px rgba(11,31,58,.45),0 2px 6px rgba(11,31,58,.06);
  --win-on:linear-gradient(160deg,#ffe7a8,#ffb547); --win-off:#16365a;
  --display:"Sora",system-ui,sans-serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
[data-theme=dark]{
  --bg:#06101c; --surface:#0e2237; --surface-2:#132c45; --ink:#e7f0f9; --muted:#8ca3ba; --line:#1c3a58;
  --ok-bg:#0d3a2f; --ok:#4fe3b8; --bad-bg:#40181b; --bad:#ff8a8d; --warn-bg:#3d2c0a; --warn:#ffc766;
  --shadow:0 18px 40px -22px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.04);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.5 var(--body);min-height:100vh}
:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
h2{font-size:1.2rem;margin-bottom:14px}
button,input,select{font:inherit;color:inherit}
small{color:var(--muted)}

/* barra superior */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;background:var(--surface);box-shadow:0 1px 0 var(--line);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--hero);color:#fff;display:grid;place-items:center;font:800 1.05rem var(--display);box-shadow:0 8px 18px -8px rgba(15,76,106,.8)}
.brand b{display:block;font:700 1.05rem var(--display);line-height:1.1}
.brand small{font-size:.82rem}
.top-actions{display:flex;gap:8px}
.icon-btn,.btn-ghost{border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:.92rem}
.icon-btn:hover,.btn-ghost:hover{border-color:var(--mint)}

/* botones y formularios */
.btn{border:0;border-radius:14px;padding:15px 24px;font-weight:700;cursor:pointer;color:#fff;background:var(--hero);box-shadow:0 14px 24px -14px rgba(15,76,106,.9);transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.block{width:100%}
label{display:block;font-weight:600;margin:16px 0 6px;font-size:.95rem}
input,select{width:100%;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:var(--surface);font-size:1rem}
input:focus,select:focus{border-color:var(--mint);outline:none;box-shadow:0 0 0 4px rgba(232,145,63,.22)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.chk{display:flex;align-items:center;gap:12px;margin-top:18px;font-weight:600}
.chk input{width:22px;height:22px;accent-color:var(--mint)}

/* tarjetas */
.card{background:var(--surface);border-radius:22px;padding:24px;box-shadow:var(--shadow);margin-bottom:20px}
.wrap{max-width:1040px;margin:0 auto;padding:22px 18px 40px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:999px;font-weight:700;font-size:.95rem}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.msg-ok{color:var(--ok);font-weight:600;margin-top:14px}
.msg-err{color:var(--bad);font-weight:600;margin-top:14px}

/* logo */
.logo-img{width:42px;height:42px;border-radius:12px;object-fit:cover;box-shadow:0 8px 18px -8px rgba(0,0,0,.6)}
.login-logo{width:min(300px,72vw);height:auto;-webkit-mask-image:radial-gradient(ellipse at center,#000 58%,transparent 100%);mask-image:radial-gradient(ellipse at center,#000 58%,transparent 100%)}
/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}
.login-hero{background:var(--hero);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center;gap:18px}
.login-hero{background:radial-gradient(circle at 100% 0%,#2f6d68 0%,transparent 60%),#0a2132}
.login-hero h1{font-size:2.2rem;line-height:1.1}
.login-hero p{margin:0;max-width:340px;opacity:.88}
.login-form{display:flex;align-items:center;justify-content:center;padding:32px}
.login-box{width:100%;max-width:400px}
.login-box h2{font-size:1.6rem;margin-bottom:4px}
.tower{filter:drop-shadow(0 24px 30px rgba(0,0,0,.35))}
@media (max-width:820px){.login{grid-template-columns:1fr}.login-hero{padding:28px 20px}.tower{width:110px;height:auto}.login-hero h1{font-size:1.7rem}}

/* héroe del propietario */
.hero{background:var(--hero);color:#fff;border-radius:28px;padding:28px;display:grid;grid-template-columns:1fr 1.15fr;gap:26px;box-shadow:0 30px 50px -28px rgba(11,31,58,.8);margin-bottom:20px}
.hero small{color:rgba(255,255,255,.78)}
.apto{font-size:3.2rem;line-height:1;margin:6px 0 14px;font-weight:800}
.hero-msg{margin:14px 0 0;opacity:.92;max-width:34ch}
.hero .pill.ok{background:rgba(39,201,160,.22);color:#a8f5de}
.hero .pill.bad{background:rgba(255,107,107,.22);color:#ffc2c2}
.facade{display:grid;grid-template-columns:repeat(auto-fit,minmax(62px,1fr));gap:14px 12px;align-content:center;background:rgba(5,15,30,.32);border-radius:20px;padding:20px}
.winwrap{text-align:center}
.win{aspect-ratio:3/4;border-radius:10px 10px 4px 4px;background:var(--win-off);position:relative;margin-bottom:6px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.08)}
.win::before,.win::after{content:"";position:absolute;background:rgba(5,15,30,.35)}
.win::before{left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%)}
.win::after{top:55%;left:0;right:0;height:2px}
.win.on{background:var(--win-on);box-shadow:0 0 22px rgba(255,181,71,.55)}
.win.half{background:linear-gradient(to top,#ffb547 0 50%,var(--win-off) 50% 100%);box-shadow:0 0 12px rgba(255,181,71,.3)}
.winwrap b{display:block;font-size:.95rem}
.winwrap small{font-size:.75rem}
@media (max-width:760px){.hero{grid-template-columns:1fr;padding:22px}.apto{font-size:2.6rem}}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:20px}
.stat{background:var(--surface);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.stat .t{color:var(--muted);font-size:.9rem}
.stat .v{font:800 1.75rem var(--display);margin-top:2px}
.stat .v.bad{color:var(--bad)} .stat .v.ok{color:var(--ok)}
.progress{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--mint),#ffd38a)}

/* listas */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item-main{min-width:0}
.item-main b{display:block;overflow-wrap:anywhere}
.item-end{display:flex;align-items:center;gap:12px;font-weight:700;white-space:nowrap}
.chip{display:inline-block;background:var(--surface-2);border-radius:999px;padding:2px 10px;font-size:.78rem;color:var(--muted);margin-right:8px}
.del{border:0;background:transparent;color:var(--bad);cursor:pointer;font-weight:600;font-size:.85rem;padding:6px}
.empty{color:var(--muted);padding:8px 0}

/* administrador */
.shell{display:grid;grid-template-columns:220px 1fr;max-width:1240px;margin:0 auto;gap:8px}
.nav{position:sticky;top:78px;align-self:start;padding:20px 10px;display:flex;flex-direction:column;gap:6px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;border-radius:14px;padding:12px 14px;cursor:pointer;font-weight:600;color:var(--muted);text-align:left}
.nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav button:hover{background:var(--surface)}
.nav button.on{background:var(--hero);color:#fff;box-shadow:0 12px 22px -14px rgba(15,76,106,.9)}
.content{padding:22px 18px 40px;min-width:0}
.page-title{font-size:1.6rem;margin-bottom:2px}
.page-sub{color:var(--muted);margin:0 0 18px}
.grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;margin-bottom:20px}
.cobro{background:var(--hero);color:#fff;border-radius:26px;padding:24px;display:flex;align-items:center;gap:22px;box-shadow:0 30px 50px -28px rgba(11,31,58,.8)}
.cobro small{color:rgba(255,255,255,.78)}
.cobro .big{font:800 1.5rem var(--display)}
.ring{flex:none}
.ring-n{font:800 34px var(--display);fill:#fff}
.ring-l{font:500 13px var(--body);fill:rgba(255,255,255,.8)}
.ring-fg{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kpi{background:var(--surface);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow)}
.kpi .t{color:var(--muted);font-size:.85rem}
.kpi .v{font:800 1.25rem var(--display);margin-top:2px;overflow-wrap:anywhere}
.bars{display:flex;align-items:flex-end;gap:10px;height:210px;padding-top:6px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;min-width:0}
.bar-val{font-size:.74rem;color:var(--muted);white-space:nowrap}
.bar-track{flex:1;width:100%;max-width:54px;background:var(--surface-2);border-radius:12px;display:flex;align-items:flex-end;overflow:hidden}
.bar-fill{width:100%;border-radius:12px;background:linear-gradient(to top,#b9561f,var(--mint))}
.bar-lab{font-weight:600;font-size:.85rem}
.hbar{margin:12px 0}
.hbar-top{display:flex;justify-content:space-between;gap:10px;font-size:.92rem;margin-bottom:5px}
.hbar-top b{font-weight:600}
.hbar-track{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.hbar-track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#b9561f,var(--mint))}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:16px;font-size:.9rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:14px;height:18px;border-radius:5px 5px 2px 2px;display:inline-block}
.fachada{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px;background:linear-gradient(180deg,#0b1f3a,#0f3b5a);padding:20px;border-radius:24px;box-shadow:var(--shadow)}
.tile{border:0;border-radius:12px 12px 5px 5px;padding:12px 6px 10px;cursor:pointer;text-align:center;font-family:var(--body);position:relative;transition:transform .12s}
.tile:hover{transform:translateY(-3px)}
.tile b{display:block;font:800 1.1rem var(--display)}
.tile small{display:block;font-size:.72rem;font-weight:600}
.tile.ok{background:var(--win-on);color:#4a2f00;box-shadow:0 0 22px rgba(255,181,71,.5)}
.tile.ok small{color:#6b4600}
.tile.bad{background:#16365a;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,107,107,.55)}
.tile.bad small{color:#ffc2c2}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:13px 22px;border-radius:14px;font-weight:600;box-shadow:0 20px 40px -16px rgba(0,0,0,.6);z-index:50}
.scroll{overflow-x:auto}
.hide{display:none}

@media (max-width:900px){.grid2{grid-template-columns:1fr}.cobro{flex-direction:column;text-align:center}}
@media (max-width:820px){
  .shell{display:block}
  .nav{position:fixed;left:0;right:0;bottom:0;top:auto;flex-direction:row;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));background:var(--surface);box-shadow:0 -8px 24px -12px rgba(11,31,58,.35);z-index:30;gap:2px}
  .nav button{flex-direction:column;gap:3px;padding:8px 6px;font-size:.7rem;flex:1;align-items:center;text-align:center}
  .content{padding-bottom:100px}
  .brand small{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast hide" role="status"></div>

<script>
const SUPABASE_URL = 'https://sisjpkdyoejuneanyscb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_f-p_sv6CmpuTEqy_e4femg_fdJqawox';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MESES_C = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const MES_INICIO = 5;
const cop = n => new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n||0);
const compact = n => new Intl.NumberFormat('es-CO',{notation:'compact',maximumFractionDigits:1}).format(n||0);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
const root = $('root');

/* ---------- tema ---------- */
function setTheme(t){ document.documentElement.dataset.theme = t; try{ localStorage.setItem('t59-theme', t); }catch(e){} }
(function(){ let s=null; try{ s=localStorage.getItem('t59-theme'); }catch(e){}
  setTheme(s || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')); })();
const toggleTheme = () => setTheme(document.documentElement.dataset.theme==='dark' ? 'light' : 'dark');

function toast(t){ const e=$('toast'); e.textContent=t; e.classList.remove('hide'); clearTimeout(toast.h); toast.h=setTimeout(()=>e.classList.add('hide'),3200); }

/* ---------- piezas visuales ---------- */
const ICONS = {
  resumen:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  aptos:'<path d="M4 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16M16 9h2a2 2 0 0 1 2 2v10M2 21h20M8 7h4M8 11h4M8 15h4"/>',
  pago:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.8c0-1.1 1.1-1.6 2.5-1.6s2.5.6 2.5 1.7c0 2.4-5 1.4-5 3.7 0 1.1 1.1 1.7 2.5 1.7s2.5-.6 2.5-1.7"/>',
  gasto:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  ajustes:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>'
};
const icon = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>`;

function towerSVG(){
  let w=''; for(let r=0;r<8;r++) for(let c=0;c<4;c++){
    const on=((r*3+c*5)%4)!==0; const x=26+c*26, y=44+r*24;
    w+=`<rect x="${x}" y="${y}" width="16" height="16" rx="3" fill="${on?'#ffc65a':'#16365a'}" ${on?'filter="url(#glow)"':''}/>`;
  }
  return `<svg class="tower" width="150" height="230" viewBox="0 0 150 240" aria-hidden="true">
    <defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="tb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b4a6e"/><stop offset="1" stop-color="#0a2a47"/></linearGradient></defs>
    <rect x="73" y="2" width="4" height="22" fill="#7be0ff"/><circle cx="75" cy="4" r="4" fill="#27c9a0"/>
    <rect x="14" y="24" width="122" height="212" rx="10" fill="url(#tb)"/>
    <rect x="46" y="30" width="58" height="22" rx="6" fill="#0a2a47"/><text x="75" y="46" text-anchor="middle" font-family="Sora,sans-serif" font-weight="800" font-size="15" fill="#7be0ff">59</text>
    ${w.replace(/y="(\d+)"/g,(m,y)=>`y="${+y+14}"`)}
  </svg>`;
}

function ring(pct,label){
  const r=70,c=2*Math.PI*r; pct=Math.max(0,Math.min(100,pct||0));
  return `<svg class="ring" viewBox="0 0 180 180" width="170" height="170" role="img" aria-label="${label}">
    <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8913f"/><stop offset="1" stop-color="#ffd38a"/></linearGradient></defs>
    <circle cx="90" cy="90" r="${r}" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="16"/>
    <circle class="ring-fg" cx="90" cy="90" r="${r}" fill="none" stroke="url(#rg)" stroke-width="16" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-target="${c*(1-pct/100)}" transform="rotate(-90 90 90)"/>
    <text x="90" y="92" text-anchor="middle" class="ring-n">${Math.round(pct)}%</text>
    <text x="90" y="114" text-anchor="middle" class="ring-l">cobrado</text></svg>`;
}
const animateRings = () => requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.ring-fg').forEach(e=>e.style.strokeDashoffset=e.dataset.target)));

function topbar(){
  return `<header class="top"><div class="brand"><img class="logo-img" src="logo-icon.png" alt="Torre 59" width="42" height="42"><div><b>Torre 59</b><small>Portal de copropietarios</small></div></div>
  <div class="top-actions"><button class="icon-btn" id="themeBtn" type="button">Tema</button><button class="btn-ghost" id="btnSalir" type="button">Salir</button></div></header>`;
}
function bindTop(){
  $('themeBtn').onclick = toggleTheme;
  $('btnSalir').onclick = async () => { await sb.auth.signOut(); location.reload(); };
}

/* ---------- sesión ---------- */
async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) return pantallaLogin();
  const { data: perfil } = await sb.from('perfiles').select('apartamento, es_admin').eq('user_id', session.user.id).maybeSingle();
  if(!perfil){ await sb.auth.signOut(); return pantallaLogin('Tu usuario no tiene un apartamento asignado. Habla con el administrador.'); }
  perfil.es_admin ? vistaAdmin() : vistaPropietario(perfil.apartamento);
}

function pantallaLogin(msg=''){
  root.innerHTML = `
  <div class="login">
    <section class="login-hero"><img class="login-logo" src="logo.png" alt="Logo de Torre 59" width="342" height="299"><h1>Torre 59</h1><p>Consulta el estado de cuenta de tu apartamento, siempre claro y al día.</p></section>
    <section class="login-form"><div class="login-box">
      <h2>Ingresa a tu apartamento</h2><small>Usa el número de tu apartamento y la clave que te entregó la administración.</small>
      <label for="u">Número de apartamento</label><input id="u" inputmode="numeric" autocomplete="username" placeholder="Ej: 504">
      <label for="p">Clave</label><input id="p" type="password" autocomplete="current-password" placeholder="Tu clave">
      <button id="go" class="btn block" style="margin-top:22px" type="button">Entrar</button>
      <div id="msg" class="msg-err" role="alert">${esc(msg)}</div>
      <button id="themeBtn" class="btn-ghost" type="button" style="margin-top:22px">Cambiar tema</button>
    </div></section>
  </div>`;
  $('themeBtn').onclick = toggleTheme;
  const entrar = async () => {
    const u = $('u').value.trim().toLowerCase(), p = $('p').value;
    if(!u || !p){ $('msg').textContent = 'Escribe tu apartamento y tu clave.'; return; }
    const email = u === 'admin' ? 'admin@torre59.app' : (/^\d+$/.test(u) ? `apto${u}@torre59.app` : '');
    if(!email){ $('msg').textContent = 'El apartamento debe ser un número.'; return; }
    $('go').disabled = true; $('msg').textContent = '';
    const { error } = await sb.auth.signInWithPassword({ email, password: p });
    if(error){ $('go').disabled = false; $('msg').textContent = 'Apartamento o clave incorrectos. Revisa los datos e intenta de nuevo.'; return; }
    init();
  };
  $('go').onclick = entrar;
  $('p').addEventListener('keydown', e => { if(e.key==='Enter') entrar(); });
}

/* ---------- datos comunes ---------- */
async function parametros(){
  const { data } = await sb.from('parametros').select('clave, valor');
  const o = {}; (data||[]).forEach(r => o[r.clave] = r.valor);
  return { cuota:o.cuota||30000, meses:o.meses_facturados||0, honorarios:o.honorarios_mensuales||250000 };
}
function listaEgresos(egresos, borrar=false){
  if(!egresos.length) return '<p class="empty">Aún no hay gastos registrados.</p>';
  return `<div class="list">${egresos.map(e=>`
    <div class="item"><div class="item-main"><b>${esc(e.concepto)}</b><small><span class="chip">${esc(e.categoria)}</span>${esc(e.fecha)}</small></div>
    <div class="item-end"><span title="${e.tiene_soporte?'Con soporte':'Sin soporte'}">${e.tiene_soporte?'✅':'⚠️'}</span>${cop(e.valor)}${borrar?`<button class="del" type="button" data-del-egreso="${e.id}">Eliminar</button>`:''}</div></div>`).join('')}</div>`;
}

/* ---------- vista propietario ---------- */
async function vistaPropietario(apto){
  root.innerHTML = topbar() + '<div class="wrap"><div class="card">Cargando tu estado de cuenta…</div></div>';
  bindTop();
  const [par, pagosR, egrR] = await Promise.all([
    parametros(),
    sb.from('pagos').select('mes, valor, fecha_registro').eq('apartamento', apto).order('fecha_registro', {ascending:false}),
    sb.from('egresos').select('*').order('fecha', {ascending:false})
  ]);
  const pagos = pagosR.data||[], egresos = egrR.data||[];
  const pagado = pagos.reduce((s,p)=>s+p.valor,0);
  const esperado = par.cuota * par.meses;
  const saldo = esperado - pagado;
  const alDia = saldo <= 0;
  const pct = esperado ? Math.min(100, pagado/esperado*100) : 0;

  let ventanas = '';
  for(let i=0;i<par.meses;i++){
    const hasta = par.cuota*(i+1), desde = par.cuota*i;
    const st = pagado >= hasta ? 'on' : (pagado > desde ? 'half' : 'off');
    const txt = st==='on' ? 'Pagado' : (st==='half' ? 'Abono' : 'Pendiente');
    ventanas += `<div class="winwrap"><div class="win ${st}"></div><b>${MESES_C[(MES_INICIO-1+i)%12]}</b><small>${txt}</small></div>`;
  }
  const msg = alDia
    ? (saldo<0 ? `Estás al día y tienes ${cop(-saldo)} a favor. Gracias por tu aporte.` : 'Estás al día con la administración. Gracias por tu aporte.')
    : `Tu saldo pendiente es ${cop(saldo)}. Puedes ponerte al día con el administrador.`;
  const totalGastos = egresos.reduce((s,e)=>s+e.valor,0);

  root.innerHTML = topbar() + `<div class="wrap">
    <section class="hero">
      <div><small>Estado de cuenta</small><h1 class="apto">Apto ${esc(apto)}</h1>
        <span class="pill ${alDia?'ok':'bad'}">${alDia?'✔ Al día':'Saldo pendiente'}</span>
        <p class="hero-msg">${msg}</p></div>
      <div class="facade" role="group" aria-label="Estado de cada mes">${ventanas||'<small>Aún no hay meses facturados.</small>'}</div>
    </section>
    <section class="stats">
      <div class="stat"><div class="t">Total pagado</div><div class="v">${cop(pagado)}</div><div class="progress" aria-hidden="true"><i style="width:${pct}%"></i></div></div>
      <div class="stat"><div class="t">Total esperado hasta hoy</div><div class="v">${cop(esperado)}</div><small>Cuota mensual de ${cop(par.cuota)}</small></div>
      <div class="stat"><div class="t">${saldo>0?'Saldo pendiente':'Saldo a favor'}</div><div class="v ${saldo>0?'bad':'ok'}">${cop(Math.abs(saldo))}</div></div>
    </section>
    <section class="card"><h2>Mis pagos</h2>
      ${pagos.length ? `<div class="list">${pagos.map(p=>`<div class="item"><div class="item-main"><b>${MESES[p.mes-1]}</b><small>Registrado el ${new Date(p.fecha_registro).toLocaleDateString('es-CO')}</small></div><div class="item-end">${cop(p.valor)}</div></div>`).join('')}</div>` : '<p class="empty">Todavía no hay pagos registrados para tu apartamento.</p>'}
      <small>Los pagos se aplican primero a los meses más antiguos.</small>
    </section>
    <section class="card"><h2>En qué se ha gastado</h2>
      <p style="margin:0 0 6px;color:var(--muted)">Total gastado por la torre: <b style="color:var(--ink)">${cop(totalGastos)}</b></p>
      ${listaEgresos(egresos)}
    </section></div>`;
  bindTop();
}

/* ---------- vista administrador ---------- */
async function vistaAdmin(tab='resumen', sel=null){
  root.innerHTML = topbar() + '<div class="wrap"><div class="card">Cargando…</div></div>';
  bindTop();
  const [par, estR, egrR, pagR] = await Promise.all([
    parametros(),
    sb.from('estado_cuenta').select('*').order('apartamento'),
    sb.from('egresos').select('*').order('fecha', {ascending:false}),
    sb.from('pagos').select('id, apartamento, mes, valor, fecha_registro').order('fecha_registro', {ascending:false})
  ]);
  const est = estR.data||[], egresos = egrR.data||[], pagos = pagR.data||[];
  const recaudado = pagos.reduce((s,p)=>s+p.valor,0);
  const esperadoTotal = est.reduce((s,e)=>s+e.total_esperado,0);
  const gastado = egresos.reduce((s,e)=>s+e.valor,0);
  const cartera = est.reduce((s,e)=>s+Math.max(e.saldo,0),0);
  const honPagados = egresos.filter(e=>e.categoria==='Honorarios administración').reduce((s,e)=>s+e.valor,0);
  const honPend = Math.max(par.honorarios*par.meses - honPagados, 0);
  const alDia = est.filter(e=>e.saldo<=0).length;

  const tabs = [['resumen','Resumen','resumen'],['aptos','Aptos','aptos'],['pago','Pagos','pago'],['gasto','Gastos','gasto'],['config','Ajustes','ajustes']];
  let c = '';

  if(tab==='resumen'){
    const metaMes = est.length*par.cuota;
    const porMes = {}; pagos.forEach(p=>porMes[p.mes]=(porMes[p.mes]||0)+p.valor);
    let barras = '';
    for(let i=0;i<par.meses;i++){ const m=((MES_INICIO-1+i)%12)+1, v=porMes[m]||0, h=metaMes?Math.min(100,v/metaMes*100):0;
      barras += `<div class="bar"><div class="bar-val">${compact(v)}</div><div class="bar-track"><div class="bar-fill" style="height:${h}%"></div></div><div class="bar-lab">${MESES_C[m-1]}</div></div>`; }
    const cats = {}; egresos.forEach(e=>cats[e.categoria]=(cats[e.categoria]||0)+e.valor);
    const catArr = Object.entries(cats).sort((a,b)=>b[1]-a[1]); const maxCat = catArr.length?catArr[0][1]:1;
    c = `<h1 class="page-title">Resumen de la torre</h1><p class="page-sub">${alDia} de ${est.length} apartamentos están al día.</p>
    <div class="grid2">
      <div class="cobro">${ring(esperadoTotal?recaudado/esperadoTotal*100:0,'Porcentaje de cartera cobrada')}
        <div><small>Recaudado</small><div class="big">${cop(recaudado)}</div><small>de ${cop(esperadoTotal)} esperados</small></div></div>
      <div class="kpis">
        <div class="kpi"><div class="t">Disponible en caja</div><div class="v">${cop(recaudado-gastado)}</div></div>
        <div class="kpi"><div class="t">Gastado</div><div class="v">${cop(gastado)}</div></div>
        <div class="kpi"><div class="t">Cartera pendiente</div><div class="v" style="color:var(--bad)">${cop(cartera)}</div></div>
        <div class="kpi"><div class="t">Honorarios por pagar</div><div class="v">${cop(honPend)}</div></div>
      </div></div>
    <section class="card"><h2>Pagos registrados por mes</h2><small>Meta mensual: ${cop(metaMes)}</small><div class="bars" style="margin-top:12px">${barras||'<p class="empty">Aún no hay meses facturados.</p>'}</div></section>
    <section class="card"><h2>Gastos por categoría</h2>${catArr.length?catArr.map(([k,v])=>`<div class="hbar"><div class="hbar-top"><b>${esc(k)}</b><span>${cop(v)}</span></div><div class="hbar-track"><i style="width:${v/maxCat*100}%"></i></div></div>`).join(''):'<p class="empty">Sin gastos registrados.</p>'}</section>
    <section class="card"><h2>Últimos pagos</h2>${pagos.length?`<div class="list">${pagos.slice(0,8).map(p=>`<div class="item"><div class="item-main"><b>Apto ${p.apartamento}</b><small>${MESES[p.mes-1]}, registrado el ${new Date(p.fecha_registro).toLocaleDateString('es-CO')}</small></div><div class="item-end">${cop(p.valor)}</div></div>`).join('')}</div>`:'<p class="empty">Todavía no hay pagos.</p>'}</section>`;
  }

  if(tab==='aptos'){
    c = `<h1 class="page-title">Apartamentos</h1><p class="page-sub">Toca un apartamento para registrarle un pago.</p>
    <div class="legend"><span><i style="background:var(--win-on)"></i>Al día</span><span><i style="background:#16365a;box-shadow:inset 0 0 0 2px rgba(255,107,107,.6)"></i>Con saldo pendiente</span></div>
    <div class="fachada">${est.map(e=>`<button class="tile ${e.saldo<=0?'ok':'bad'}" type="button" data-apto="${e.apartamento}"><b>${e.apartamento}</b><small>${e.saldo<=0?'Al día':'Debe '+compact(e.saldo)}</small></button>`).join('')}</div>`;
  }

  if(tab==='pago'){
    c = `<h1 class="page-title">Pagos</h1><p class="page-sub">Registra lo que paga cada apartamento.</p>
    <section class="card"><h2>Registrar pago</h2><div class="row">
      <div><label for="fa">Apartamento</label><select id="fa">${est.map(e=>`<option ${String(e.apartamento)===String(sel)?'selected':''}>${e.apartamento}</option>`).join('')}</select></div>
      <div><label for="fm">Mes que paga</label><select id="fm">${MESES.map((m,i)=>`<option value="${i+1}" ${i+1===MES_INICIO+Math.max(par.meses-1,0)?'selected':''}>${m}</option>`).join('')}</select></div>
      <div><label for="fv">Valor</label><input id="fv" type="number" inputmode="numeric" value="${par.cuota}"></div></div>
      <button id="gp" class="btn" style="margin-top:22px" type="button">Guardar pago</button><div id="m" role="status"></div>
      <p><small>Si pagan dos meses juntos, registra un solo pago por el total (por ejemplo 60.000).</small></p></section>
    <section class="card"><h2>Pagos recientes</h2>${pagos.length?`<div class="list">${pagos.slice(0,12).map(p=>`<div class="item"><div class="item-main"><b>Apto ${p.apartamento}</b><small>${MESES[p.mes-1]}, ${new Date(p.fecha_registro).toLocaleDateString('es-CO')}</small></div><div class="item-end">${cop(p.valor)}<button class="del" type="button" data-del-pago="${p.id}">Eliminar</button></div></div>`).join('')}</div>`:'<p class="empty">Todavía no hay pagos.</p>'}</section>`;
  }

  if(tab==='gasto'){
    const hoy = new Date().toISOString().slice(0,10);
    c = `<h1 class="page-title">Gastos</h1><p class="page-sub">Cada gasto queda visible para los propietarios.</p>
    <section class="card"><h2>Registrar gasto</h2>
      <div class="row"><div><label for="gf">Fecha</label><input id="gf" type="date" value="${hoy}"></div><div><label for="gv">Valor</label><input id="gv" type="number" inputmode="numeric"></div></div>
      <label for="gc">Concepto</label><input id="gc" placeholder="Ej: Reparación de cámaras">
      <div class="row"><div><label for="gk">Categoría</label><select id="gk"><option>Honorarios administración</option><option>Mantenimiento</option><option>Papelería</option><option>Servicios públicos</option><option>Aseo</option><option>Otros</option></select></div>
      <div><label for="gap">Aprobado por</label><input id="gap" placeholder="Comité o administrador"></div></div>
      <label for="go2">Observaciones</label><input id="go2">
      <label class="chk"><input id="gs" type="checkbox" checked> Tiene soporte (factura, recibo o foto)</label>
      <button id="ge" class="btn" style="margin-top:22px" type="button">Guardar gasto</button><div id="m" role="status"></div></section>
    <section class="card"><h2>Todos los gastos</h2>${listaEgresos(egresos,true)}</section>`;
  }

  if(tab==='config'){
    c = `<h1 class="page-title">Ajustes</h1><p class="page-sub">Valores que usa todo el sistema.</p>
    <section class="card"><div class="row">
      <div><label for="pc">Cuota mensual por apartamento</label><input id="pc" type="number" value="${par.cuota}"></div>
      <div><label for="pm">Meses facturados (desde mayo)</label><input id="pm" type="number" value="${par.meses}"></div>
      <div><label for="ph">Honorarios mensuales del administrador</label><input id="ph" type="number" value="${par.honorarios}"></div></div>
      <button id="gcfg" class="btn" style="margin-top:22px" type="button">Guardar ajustes</button><div id="m" role="status"></div>
      <p><small>Cada mes nuevo, sube “Meses facturados” en 1 para que el sistema cobre ese mes.</small></p></section>`;
  }

  root.innerHTML = topbar() + `<div class="shell"><nav class="nav" aria-label="Secciones">${tabs.map(([k,l,i])=>`<button type="button" class="${k===tab?'on':''}" data-t="${k}">${icon(i)}<span>${l}</span></button>`).join('')}</nav><main class="content">${c}</main></div>`;
  bindTop(); animateRings();
  document.querySelectorAll('.nav button').forEach(b => b.onclick = () => vistaAdmin(b.dataset.t));
  document.querySelectorAll('.tile').forEach(b => b.onclick = () => vistaAdmin('pago', b.dataset.apto));

  const msg = (t, ok=true) => { const m=$('m'); m.className = ok?'msg-ok':'msg-err'; m.textContent = t; };

  if($('gp')) $('gp').onclick = async () => {
    const valor = parseInt($('fv').value,10);
    if(!valor || valor<=0) return msg('Escribe un valor válido.', false);
    $('gp').disabled = true;
    const { error } = await sb.from('pagos').insert({ apartamento:+$('fa').value, mes:+$('fm').value, anio:2026, valor });
    if(error){ $('gp').disabled = false; return msg('No se pudo guardar: '+error.message, false); }
    toast(`Pago de ${cop(valor)} guardado para el apto ${$('fa').value}`); vistaAdmin('pago');
  };
  if($('ge')) $('ge').onclick = async () => {
    const valor = parseInt($('gv').value,10), concepto = $('gc').value.trim();
    if(!valor || valor<=0 || !concepto) return msg('Completa el concepto y el valor.', false);
    const soporte = $('gs').checked;
    if(!soporte && !confirm('Este gasto no tiene soporte. ¿Guardarlo de todas formas?')) return;
    $('ge').disabled = true;
    const { error } = await sb.from('egresos').insert({ fecha:$('gf').value, concepto, categoria:$('gk').value, valor, tiene_soporte:soporte, aprobado_por:$('gap').value.trim(), observaciones:$('go2').value.trim() });
    if(error){ $('ge').disabled = false; return msg('No se pudo guardar: '+error.message, false); }
    toast('Gasto guardado'); vistaAdmin('gasto');
  };
  if($('gcfg')) $('gcfg').onclick = async () => {
    const filas = [['cuota',+$('pc').value],['meses_facturados',+$('pm').value],['honorarios_mensuales',+$('ph').value]];
    const { error } = await sb.from('parametros').upsert(filas.map(([clave,valor])=>({clave,valor})));
    error ? msg('No se pudo guardar: '+error.message, false) : (toast('Ajustes guardados'), vistaAdmin('config'));
  };
  document.querySelectorAll('[data-del-pago]').forEach(b => b.onclick = async () => {
    if(!confirm('¿Eliminar este pago? No se puede deshacer.')) return;
    const { error } = await sb.from('pagos').delete().eq('id', b.dataset.delPago);
    error ? toast('No se pudo eliminar') : (toast('Pago eliminado'), vistaAdmin('pago'));
  });
  document.querySelectorAll('[data-del-egreso]').forEach(b => b.onclick = async () => {
    if(!confirm('¿Eliminar este gasto? No se puede deshacer.')) return;
    const { error } = await sb.from('egresos').delete().eq('id', b.dataset.delEgreso);
    error ? toast('No se pudo eliminar') : (toast('Gasto eliminado'), vistaAdmin('gasto'));
  });
}

init();
</script>
</body>
</html>
